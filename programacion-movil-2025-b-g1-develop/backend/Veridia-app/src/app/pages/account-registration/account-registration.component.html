<ion-content fullscreen class="ion-padding register-page">
  <h1 class="title">Crear cuenta</h1>

  <form (ngSubmit)="registrar()" #regForm="ngForm" novalidate>
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="modelo.nombre" name="nombre" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="modelo.email" name="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="modelo.password" name="password" required minlength="4"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="!regForm.form.valid" class="register-btn">
      Registrarse
    </ion-button>
  </form>

  <div class="back-link" (click)="backToLogin()" tabindex="0" role="link">
    Volver a iniciar sesión
  </div>
</ion-content>
