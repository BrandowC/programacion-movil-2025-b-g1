<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Chat UX</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #25d366;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 20px;
      }
      .chat-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .chat-item {
        background-color: white;
        padding: 15px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-item:hover {
        background-color: #f0f0f0;
      }
      .chat-info {
        flex-grow: 1;
        margin-left: 10px;
      }
      .chat-name {
        font-weight: bold;
      }
      .chat-time {
        color: gray;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>Chats</header>
    <ul class="chat-list">
      <li class="chat-item">
        <div class="chat-info">
          <div class="chat-name">Juan Pérez</div>
          <div class="chat-msg">Hola, ¿cómo estás?</div>
        </div>
        <div class="chat-time">10:24</div>
      </li>
      <li class="chat-item">
        <div class="chat-info">
          <div class="chat-name">María López</div>
          <div class="chat-msg">Nos vemos mañana</div>
        </div>
        <div class="chat-time">09:50</div>
      </li>
    </ul>
  </body>
</html>
